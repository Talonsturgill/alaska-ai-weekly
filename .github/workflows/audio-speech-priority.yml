name: Speech-priority audio regression
on:
  pull_request:
    paths:
      - 'scripts/speech_priority.py'
      - 'scripts/dispatch_mix.py'
      - 'scripts/render_provenance.py'
      - 'scripts/audio_report.py'
      - 'tests/test_speech_priority.py'
      - 'tests/test_render_provenance.py'
      - '.github/workflows/audio-speech-priority.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/speech_priority.py'
      - 'scripts/dispatch_mix.py'
      - 'scripts/render_provenance.py'
      - 'scripts/audio_report.py'
      - 'tests/test_speech_priority.py'
      - 'tests/test_render_provenance.py'
      - '.github/workflows/audio-speech-priority.yml'
permissions:
  contents: read
jobs:
  audio-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p 'test_speech_priority.py'
      - run: python -m unittest discover -s tests -p 'test_render_provenance.py'
      - run: python -m unittest discover -s tests -p 'test_mix_aac_check.py'
      - run: python scripts/audio_report.py --self-test
