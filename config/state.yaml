- date: '2026-08-07'
  topic: 'THE BOAT, NOT THE BRAIN: Shinkei Systems'' harvesting robot uses computer
    vision and machine learning to find the brain of each INDIVIDUAL salmon, because
    that spot sits in a different place in every fish, which is why a fixed jig fails
    and a model is required (independently reported by TechCrunch in 2022 and again
    in 2024; founder Khawaja verbatim). The technique is ike jime, a hand skill taking
    years that almost nobody on a small Alaska boat has. On July 30th one PR-style
    trade write-up said a smaller PSDN-S is coming to Cook Inlet, nearly 60 percent
    smaller, robot free and catch bought at a premium, with NO dollar figure, NO boat
    count and NO start date anywhere, and no Alaska outlet or fisheries trade outlet
    has covered it. Set against that: the company''s own 2024 goal was ten machines
    COMPANY WIDE, while Upper Cook Inlet alone holds more than 1,300 salmon permits,
    about a tenth of Alaska''s total (ADFG). Earned angle: the hard part, perception,
    is solved and the unsolved part is the boat. Act 3 gives the fair case for patience
