- date: '2026-08-05'
  topic: 'THE NET COMES FIRST: Alaska may hold about 30,000 insect species and has
    names for about 9,000 (per ADN, 2026-08-02), growing about 1,000 a decade, which
    is about 21,000 unnamed and about 210 years by our own arithmetic. The curator
    who pins the specimens at the UA Museum of the North, Derek Sikes, co-authored
    a 2008 Systematic Biology neural network (DOI 10.1080/10635150802032982) that
    identified 97.5 percent of 80 unknown ground beetle DNA sequences. Eighteen years
    on the count has not moved faster, so the model was never the binding constraint:
    a classifier needs a sequence, a sequence needs a specimen, and a specimen needs
    somebody in a field with a net. Fair counter stated on screen: a 2008 network
    on two well-studied groups is not a 2026 model and nobody has tested one here.
    Abstract-only sourcing disclosed. The AI connection is the film''s own synthesis
    and it says so.'
