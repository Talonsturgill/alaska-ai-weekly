- date: '2026-07-26'
  topic: 'THE FIELD THAT STOPPED IN 2019: Alaska''s Division of Elections asked the
    DMV to check roughly 15,200 license and ID applicants at once. A normal quarterly
    pass returns more like 200 names; this one flagged about 3,500 Alaskans, mailed
    them letters saying the state had information they may not be citizens, and moved
    3,048 registrations from active to inactive four weeks before the August 18 primary.
    Nobody was removed and nobody lost the vote, and an inactive Alaskan can still
    cast a questioned ballot. Cause: a DMV file records citizenship as of the day
    you apply and naturalization never propagates back, so a Fairbanks voter licensed
    in 2019 and naturalized in 2025 was flagged although neither record was wrong.
    NO AI is involved anywhere and the film says so on screen. The transferable lesson
    is the asymmetry, since widening a query costs almost nothing while adjudicating
    each result costs what it always did.'
