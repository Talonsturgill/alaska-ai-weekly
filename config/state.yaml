  topic: 'THE ONE IT DIDN''T HEAR: the Alaska Earthquake Center runs a landslide-detection
    ALGORITHM (not AI) across some 200 of about 500 seismic stations, discriminating
    a slide''s minute-long rumble from a quake''s seconds. The Aug 10 2025 Tracy Arm
    slide (up to 100M cubic meters, runup 470 to 500 m, no injuries or fatalities)
    fell OUTSIDE the search area, so there was no automatic detection and researchers
    ran the algorithm by hand on data the sensors recorded anyway. Deeper ceiling:
    rock makes no sound until it moves, so listening is a record and never a warning.
    NSF awarded UAF 1,772,170 dollars of a 4,430,711 dollar project on 2026-07-10
    for fast surrogate models plus data assimilation to make real-time digital twins;
    begins 2026-08-01, runs to 2032, year one delivers datasets. Unreported scoop,
    no press release existed.'
